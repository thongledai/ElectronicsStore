<!DOCTYPE html>
<html lang="en" th:replace="~{layouts/customer-layout :: layout(
        'Forgot Password — TechNova Electronics',
        'Recover your TechNova Electronics account password via OTP code.',
        ~{::main}, ~{}, 'auth.js', true)}">
<head><title>Forgot Password — TechNova Electronics</title></head>
<body>

<main>
  <div class="container auth-wrap">
    <div class="row justify-content-center w-100">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width:64px;height:64px;font-size:1.6rem">
              <i class="fas fa-key"></i>
            </div>
            <h1 class="h4 mb-1">Forgot Password?</h1>
            <p class="text-muted small">
              Enter your account email address. We will send a 6-digit OTP code to reset your password.
            </p>
          </div>

          <form id="forgotForm" novalidate>
            <div class="mb-4">
              <label class="form-label" for="fpEmail">Email Address</label>
              <div class="input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" class="form-control" id="fpEmail"
                       placeholder="you@example.com" autocomplete="email" required>
              </div>
              <div class="invalid-feedback" id="errFpEmail"></div>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100 mb-3" id="fpSubmit">
              <i class="fas fa-paper-plane me-2"></i>Send OTP Code
            </button>

            <div class="text-center">
              <a th:href="@{/login}" class="btn btn-ghost text-muted small">
                <i class="fas fa-arrow-left me-2"></i>Back to Sign In
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
