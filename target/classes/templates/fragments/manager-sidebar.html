<!--
  Sidebar of the manager role.   Use: <nav th:replace="~{fragments/manager-sidebar :: sidebar('index')}"></nav>
  (normally included by layouts/dashboard-layout.html — the parameter is the key of the active link)
-->
<nav th:fragment="sidebar(active)" class="role-navbar" aria-label="Điều hướng Quản lý">
    <div class="role-brand-row">
        <a class="brand" th:href="@{/manager/index}"><i class="fa-solid fa-bolt me-2"></i>Tech<span>Nova</span></a>
        <button class="nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#roleNavLinks" aria-controls="roleNavLinks" aria-expanded="false" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="nav-caption">Quản lý</div>
    <div class="nav-links collapse d-lg-flex" id="roleNavLinks">
        <a th:href="@{/manager/index}" th:classappend="${active == 'index'} ? 'active'" th:attr="aria-current=${active == 'index'} ? 'page'"><i class="fa-solid fa-chart-pie"></i><span>Tổng quan</span></a>
        <a th:href="@{/manager/users}" th:classappend="${active == 'users'} ? 'active'" th:attr="aria-current=${active == 'users'} ? 'page'"><i class="fa-solid fa-users"></i><span>Người dùng</span></a>
        <a th:href="@{/manager/products}" th:classappend="${active == 'products'} ? 'active'" th:attr="aria-current=${active == 'products'} ? 'page'"><i class="fa-solid fa-box"></i><span>Sản phẩm</span></a>
        <a th:href="@{/manager/categories}" th:classappend="${active == 'categories'} ? 'active'" th:attr="aria-current=${active == 'categories'} ? 'page'"><i class="fa-solid fa-layer-group"></i><span>Danh mục</span></a>
        <a th:href="@{/manager/promotions}" th:classappend="${active == 'promotions'} ? 'active'" th:attr="aria-current=${active == 'promotions'} ? 'page'"><i class="fa-solid fa-tags"></i><span>Khuyến mãi</span></a>
        <a th:href="@{/manager/carriers}" th:classappend="${active == 'carriers'} ? 'active'" th:attr="aria-current=${active == 'carriers'} ? 'page'"><i class="fa-solid fa-truck-fast"></i><span>Đơn vị vận chuyển</span></a>
        <a th:href="@{/manager/orders}" th:classappend="${active == 'orders'} ? 'active'" th:attr="aria-current=${active == 'orders'} ? 'page'"><i class="fa-solid fa-receipt"></i><span>Đơn hàng</span></a>
        <a th:href="@{/manager/statistics}" th:classappend="${active == 'statistics'} ? 'active'" th:attr="aria-current=${active == 'statistics'} ? 'page'"><i class="fa-solid fa-chart-line"></i><span>Thống kê</span></a>
    </div>
    <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Chuyển giao diện sáng tối" title="Chuyển giao diện sáng tối"><i class="fa-solid fa-moon"></i></button>
        <!-- Spring Security logout (POST + CSRF token added automatically by th:action) -->
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="theme-toggle" type="submit" aria-label="Đăng xuất" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
        </form>
        <div class="role-avatar">M</div>
    </div>
</nav>
