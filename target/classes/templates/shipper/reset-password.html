<!DOCTYPE html>
<html lang="en" th:replace="~{layouts/dashboard-layout :: layout('Change Password', 'shipper', 'reset-password', ~{::section.content})}">
<head><title>Change Password | TechNova</title></head>
<body>
<section class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="title">Change Delivery Password</h1>
      <div class="subtitle">Update your Delivery Shipper account password.</div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6 col-md-8">
      <div class="panel">
        <form id="resetPassForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="oldPassword">Current Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="oldPassword" placeholder="Enter current password" required>
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="oldPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="errOldPassword"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="newPassword">New Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="newPassword" placeholder="Minimum 6 characters" required>
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="newPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="errNewPassword"></div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" for="confirmNewPassword">Confirm New Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmNewPassword" placeholder="Re-enter new password" required>
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="confirmNewPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="errConfirmNewPassword"></div>
          </div>

          <button type="submit" class="btn btn-primary" id="btnSubmitReset">
            <i class="fa-solid fa-floppy-disk me-1"></i>Save New Password
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
</body>
</html>
