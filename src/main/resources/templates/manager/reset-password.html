<!DOCTYPE html>
<html lang="vi" th:replace="~{layouts/dashboard-layout :: layout('Đổi mật khẩu', 'manager', 'reset-password', ~{::section.content})}">
<head><title>Đổi mật khẩu | UTE Shop</title></head>
<body>
<section class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="title">Đổi mật khẩu quản lý</h1>
      <div class="subtitle">Cập nhật mật khẩu quản trị viên để bảo vệ hệ thống.</div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6 col-md-8">
      <div class="panel">
        <form id="resetPassForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="oldPassword">Mật khẩu hiện tại</label>
            <div class="input-group">
              <input type="password" class="form-control" id="oldPassword" placeholder="Enter current password" required>
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="oldPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="errOldPassword"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="newPassword">Mật khẩu mới</label>
            <div class="input-group">
              <input type="password" class="form-control" id="newPassword" placeholder="Tối thiểu 6 ký tự" required>
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="newPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="errNewPassword"></div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" for="confirmNewPassword">Xác nhận mật khẩu mới</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmNewPassword" placeholder="Nhập lại mật khẩu mới" required>
              <button class="btn btn-outline-secondary toggle-pass" type="button" data-target="confirmNewPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="errConfirmNewPassword"></div>
          </div>

          <button type="submit" class="btn btn-primary" id="btnSubmitReset">
            <i class="fa-solid fa-floppy-disk me-1"></i>Lưu mật khẩu mới
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
</body>
</html>
