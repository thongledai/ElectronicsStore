<!DOCTYPE html>
<html lang="en" th:replace="~{layouts/dashboard-layout :: layout('Styles', 'manager', 'styles', ~{::section.content})}">
<head>
    <title>Styles | TechNova</title>
</head>
<body>
<section class="content">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="title">Styles</h1>
            <div class="subtitle">
                Manage product variant styles (Color, Storage, RAM...) and values assigned to categories.
            </div>
        </div>
        <button class="btn btn-primary btn-sm" id="btnOpenCreateStyleModal">
            <i class="fa-solid fa-plus me-1"></i>Add New Style
        </button>
    </div>

    <!-- Search & Filter Panel -->
    <div class="panel mb-3">
        <div class="row g-2 align-items-center">
            <div class="col-md-6">
                <div class="input-group input-group-sm">
                    <input
                        class="form-control"
                        id="searchInput"
                        placeholder="Search style name..."
                    >
                    <button class="btn btn-outline-secondary" type="button" id="btnSearch">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <div class="col-md-3">
                <select class="form-select form-select-sm" id="statusFilter">
                    <option value="">-- All Statuses --</option>
                    <option value="active">Active</option>
                    <option value="deleted">Soft Deleted</option>
                </select>
            </div>

            <div class="col-md-3 text-md-end">
                <span class="muted" id="totalRecordsText">0 records</span>
            </div>
        </div>
    </div>

    <!-- Main Data Table -->
    <div class="panel">
        <h2 class="paneltitle mb-3">Style List</h2>

        <div class="table-responsive">
            <table class="table" id="dataTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Style</th>
                        <th>Status</th>
                        <th class="text-end"></th>
                    </tr>
                </thead>

                <tbody id="styleTableBody">
                    <tr>
                        <td colspan="4" class="text-center py-4 text-muted">
                            Loading data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="muted" id="pageInfoText">Page 1/1</span>

            <div class="btn-group btn-group-sm" id="paginationControls">
                <button class="btn btn-outline-secondary" id="btnPrevPage">
                    Previous
                </button>

                <button class="btn btn-primary" id="btnCurrentPage">
                    1
                </button>

                <button class="btn btn-outline-secondary" id="btnNextPage">
                    Next
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Add / Edit Style -->
    <div class="modal fade" id="styleFormModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="styleModalTitle">
                        Add New Style
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>
                </div>

                <form id="styleForm">
                    <input type="hidden" id="styleId">

                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Style Name <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="styleName"
                                required
                                placeholder="Example: Color, Internal Storage"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Applicable Categories
                            </label>

                            <div
                                id="styleCategoryCheckboxes"
                                class="border rounded p-2 bg-light d-flex flex-column gap-1"
                                style="max-height: 200px; overflow-y: auto;">

                                <!-- Filled dynamically by JS -->

                            </div>
                        </div>

                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="styleIsActive" checked>
                            <label class="form-check-label fw-semibold" for="styleIsActive">Active</label>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary btn-sm"
                            data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary btn-sm"
                            id="btnSaveStyle">
                            Save
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Modal: Manage Style Values -->
    <div class="modal fade" id="styleValuesModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Manage Values for Style:
                        <span class="text-primary" id="modalStyleName"></span>
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>
                </div>

                <div class="modal-body">

                    <!-- Add Value Form -->
                    <div class="input-group input-group-sm mb-3">

                        <input
                            type="text"
                            class="form-control"
                            id="newStyleValueName"
                            placeholder="Enter a new value (e.g. Black, White, 256GB...)"
                        >

                        <button
                            class="btn btn-primary"
                            type="button"
                            id="btnAddStyleValue">
                            <i class="fa-solid fa-plus me-1"></i>Add Value
                        </button>

                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered mb-0">

                            <thead>
                                <tr>
                                    <th>Value Name</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>

                            <tbody id="styleValuesTableBody">
                                <tr>
                                    <td colspan="3" class="text-center py-3 text-muted">
                                        Loading values...
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Script for Style Management -->
    <script th:src="@{/js/manager/styles.js}"></script>

</section>
</body>
</html>
