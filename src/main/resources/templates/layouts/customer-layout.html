<!DOCTYPE html>
<!--
  Layout for Customer / Guest pages (customer/*, pages/*, auth/*).

  A page uses it like this:
    <html th:replace="~{layouts/customer-layout :: layout(
            'Page title', 'Meta description', ~{::main}, ~{}, 'page-script.js', false)}">
      <head><title>Page title</title></head>
      <body><main> ... page content ... </main></body>
    </html>

  Parameters
    title        <title> text
    description  <meta name="description">
    content      page <main>            -> ~{::main}
    extra        optional fragment rendered between <main> and footer (e.g. modal) -> ~{::#id} or ~{}
    pageScript   file in /static/js loaded after data.js + main.js (e.g. 'cart.js'); '' for none
    minimal      true = login-style header/footer (no announcement bar, no search)
-->
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, description, content, extra, pageScript, minimal)" th:with="URL=@{/}">
<head th:replace="~{fragments/header :: head(${title}, ${description})}"></head>
<body>

<!-- Scroll progress indicator -->
<div class="scroll-progress" aria-hidden="true"></div>

<th:block th:unless="${minimal}"><div th:replace="~{fragments/customer-navbar :: navbar}"></div></th:block>
<th:block th:if="${minimal}"><div th:replace="~{fragments/customer-navbar :: navbar-minimal}"></div></th:block>

<main th:replace="${content}"></main>

<th:block th:replace="${extra}"></th:block>

<th:block th:unless="${minimal}"><div th:replace="~{fragments/footer :: footer}"></div></th:block>

<!-- Back to top -->
<button class="back-to-top" type="button" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>

<!-- Scripts: Bootstrap → data → core → page script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/data.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:if="${pageScript != null and !pageScript.isEmpty()}" th:src="@{'/js/' + ${pageScript} + '?v=3'}"></script>



</body>
</html>
