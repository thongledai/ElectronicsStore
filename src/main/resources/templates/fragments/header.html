<!--
  Shared <head> for EVERY page (customer + manager + employee + shipper).
  Use:  <head th:replace="~{fragments/header :: head(${title}, ${description})}"></head>
  Requires ${URL} (declared on <html> by the layouts).
-->
<head th:fragment="head(title, description)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1b34">
  <meta name="description" th:content="${description}">
  <title th:text="${title}">TechNova Electronics</title>

  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

  <!-- Base URL (context path + "/") for scripts: js/data.js and js/main.js build every link from it -->
  <script th:inline="javascript">window.APP_URL = /*[[@{/}]]*/ '/';</script>

  <!-- Apply saved theme before first paint; default to the light theme. -->
  <script>(function(){try{var t=localStorage.getItem("technova_theme");if(t)document.documentElement.setAttribute("data-theme",JSON.parse(t));else document.documentElement.setAttribute("data-theme","light")}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>

  <!-- Apply logged-in auth state before first paint (no flash of Guest / Sign In in dropdown) -->
  <script>(function(){try{var u=JSON.parse(localStorage.getItem('technova_user')||'null');var t=localStorage.getItem('technova_jwt');if(t||(u&&u.email)){document.documentElement.classList.add('user-logged-in');}}catch(e){}})();</script>
  <style>
    html.user-logged-in .js-auth-guest { display: none !important; }
    html.user-logged-in .js-auth-user { display: block !important; }
  </style>

  <!-- Google Fonts: Plus Jakarta Sans & Be Vietnam Pro (Full Vietnamese glyphs & Modern Tech UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 + Font Awesome 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Stylesheets được tách theo nhóm chức năng -->
  <link th:href="@{/css/core.css}" rel="stylesheet">
  <link th:href="@{/css/home.css}" rel="stylesheet">
  <link th:href="@{/css/catalog.css}" rel="stylesheet">
  <link th:href="@{/css/pages.css}" rel="stylesheet">
  <link th:href="@{/css/responsive.css}" rel="stylesheet">
</head>
