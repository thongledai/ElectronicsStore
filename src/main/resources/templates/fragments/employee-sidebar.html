<!-- Shared Employee dashboard navigation. -->
<nav th:fragment="sidebar(active)" class="role-navbar" aria-label="Điều hướng nhân viên">
    <div class="role-brand-row">
        <a class="brand" th:href="@{/employee/index}"><i class="fa-solid fa-bolt me-2"></i>Tech<span>Nova</span></a>
        <button class="nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#roleNavLinks"
                aria-controls="roleNavLinks" aria-expanded="false" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="nav-caption">Nhân viên</div>
    <div class="nav-links collapse d-lg-flex" id="roleNavLinks">
        <a th:href="@{/employee/index}" th:classappend="${active == 'index'} ? 'active'"
           th:attr="aria-current=${active == 'index'} ? 'page'"><i class="fa-solid fa-chart-pie"></i><span>Tổng quan</span></a>
        <a th:href="@{/customer/index}" title="Go to Customer Storefront"><i class="fa-solid fa-store"></i><span>Mua hàng</span></a>
        <a th:href="@{/employee/orders}"
           th:classappend="${active == 'orders' and (statusFilter == null or statusFilter == '')} ? 'active'"

        <a th:href="@{/employee/orders(status='NOT_PROCESSED')}" th:classappend="${statusFilter == 'NOT_PROCESSED'} ? 'active'" th:attr="aria-current=${statusFilter == 'NOT_PROCESSED'} ? 'page'"><i class="fa-solid fa-bell"></i><span>Chưa xử lý</span></a>
        <a th:href="@{/employee/orders(status='CONFIRMED')}" th:classappend="${statusFilter == 'CONFIRMED'} ? 'active'" th:attr="aria-current=${statusFilter == 'CONFIRMED'} ? 'page'"><i class="fa-solid fa-clipboard-check"></i><span>Đã xác nhận</span></a>
        <a th:href="@{/employee/orders(status='SHIPPING')}" th:classappend="${statusFilter == 'SHIPPING'} ? 'active'" th:attr="aria-current=${statusFilter == 'SHIPPING'} ? 'page'"><i class="fa-solid fa-truck"></i><span>Đang vận chuyển</span></a>
        <a th:href="@{/employee/orders(status='DELIVERED')}" th:classappend="${statusFilter == 'DELIVERED'} ? 'active'" th:attr="aria-current=${statusFilter == 'DELIVERED'} ? 'page'"><i class="fa-solid fa-circle-check"></i><span>Đã giao</span></a>
        <a th:href="@{/employee/orders(status='CANCELLED')}" th:classappend="${statusFilter == 'CANCELLED'} ? 'active'" th:attr="aria-current=${statusFilter == 'CANCELLED'} ? 'page'"><i class="fa-solid fa-ban"></i><span>Đã hủy</span></a>
        <a th:href="@{/employee/orders(status='RETURNED')}" th:classappend="${statusFilter == 'RETURNED'} ? 'active'" th:attr="aria-current=${statusFilter == 'RETURNED'} ? 'page'"><i class="fa-solid fa-arrow-rotate-left"></i><span>Đã hoàn</span></a>

    <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện">

        <div class="dropdown">
            <button class="role-avatar border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mở menu tài khoản"><span class="js-role-avatar-fallback">E</span></button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="fa-solid fa-user me-2"></i>Hồ sơ cá nhân</a></li>
                <li><a class="dropdown-item" th:href="@{/employee/reset-password}"><i class="fa-solid fa-key me-2"></i>Đổi mật khẩu</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><form th:action="@{/logout}" method="post" class="m-0 js-logout-form"><button class="dropdown-item text-danger" type="submit"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</button></form></li>
            </ul>
        </div>
    </div>
</nav>
