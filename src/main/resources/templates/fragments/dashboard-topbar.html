<!--
  Top bar of the dashboards.
  Use:  <header th:replace="~{fragments/dashboard-topbar :: topbar(${role}, ${title})}"></header>
-->
<header class="top" th:fragment="topbar(role, title)">
  <div>
    <div class="muted">TechNova Electronics / <span th:text="${#strings.capitalize(role)}">Manager</span></div>
    <strong th:text="${title}">Tổng quan</strong>
  </div>
  <div class="dropdown">
    <button class="btn p-0 border-0 d-flex align-items-center gap-2 text-decoration-none shadow-none" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Tài khoản">
      <div class="text-end d-none d-sm-block">
        <strong class="d-block text-body js-topbar-username" style="font-size: 0.92rem; line-height: 1.2;" th:text="${#strings.capitalize(role)}">Manager</strong>
        <span class="muted small js-topbar-role" th:text="${#strings.toUpperCase(role)}">MANAGER</span>
      </div>
      <div class="rounded-circle overflow-hidden border shadow-sm flex-shrink-0" style="width: 38px; height: 38px;">
        <img class="w-100 h-100 object-fit-cover js-topbar-avatar" src="https://ui-avatars.com/api/?name=User&background=0d6efd&color=fff" alt="Avatar" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=User&background=0d6efd&color=fff';">
      </div>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="min-width: 200px;">
      <li>
        <h6 class="dropdown-header js-topbar-name">Tài khoản</h6>
      </li>
      <li>
        <a class="dropdown-item py-2" th:href="@{/profile}">
          <i class="fas fa-user-gear me-2 text-primary"></i>Hồ sơ cá nhân
        </a>
      </li>
      <li>
        <a class="dropdown-item py-2" th:href="@{|/${role}/reset-password|}">
          <i class="fas fa-key me-2 text-warning"></i>Đổi mật khẩu
        </a>
      </li>
      <li><hr class="dropdown-divider my-1"></li>
      <li>
        <form th:action="@{/logout}" method="post" class="m-0 js-logout-form">
          <button type="submit" class="dropdown-item py-2 text-danger">
            <i class="fas fa-right-from-bracket me-2"></i>Đăng xuất
          </button>
        </form>
      </li>
    </ul>
  </div>
</header>
