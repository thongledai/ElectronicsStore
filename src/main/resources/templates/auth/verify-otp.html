<!DOCTYPE html>
<html lang="vi" th:replace="~{layouts/customer-layout :: layout(
        'Xác minh mã OTP — UTE Shop',
        'Xác minh mã OTP để kích hoạt tài khoản hoặc khôi phục mật khẩu.',
        ~{::main}, ~{}, 'auth.js', true)}">
<head><title>Xác minh mã OTP — UTE Shop</title></head>
<body>

<main>
  <div class="container auth-wrap">
    <div class="row justify-content-center w-100">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width:64px;height:64px;font-size:1.6rem">
              <i class="fas fa-shield-halved"></i>
            </div>
            <h1 class="h4 mb-1" id="otpTitle">Xác minh mã OTP</h1>
            <p class="text-muted small" id="otpSubtitle">
              Nhập mã OTP gồm 6 chữ số đã được gửi đến email của bạn.
            </p>
          </div>

          <form id="otpForm" novalidate>
            <!-- Email is passed from previous step and stored in hidden input -->
            <input type="hidden" id="otpEmail">

            <!-- Countdown Timer & Resend Button -->
            <div class="d-flex justify-content-between align-items-center mb-3 p-2 px-3 rounded-3 bg-body-tertiary border">
              <div class="small">
                <i class="fas fa-clock me-1 text-primary"></i>Hết hạn sau: <strong id="otpTimerText" class="text-danger fw-bold">05:00</strong>
              </div>
              <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 fw-semibold" id="btnResendOtp" disabled>
                <i class="fas fa-rotate-right me-1"></i>Gửi lại mã
              </button>
            </div>

            <div class="mb-3">
              <label class="form-label" for="otpCode">Mã OTP (6 chữ số)</label>
              <div class="input-icon">
                <i class="fas fa-key"></i>
                <input type="text" class="form-control text-center fw-bold" id="otpCode"
                       placeholder="123456" maxlength="6" autocomplete="one-time-code"
                       style="font-size:1.3rem;letter-spacing:4px;" required>
              </div>
              <div class="invalid-feedback" id="errOtpCode"></div>
            </div>

            <!-- Trường dùng trong luồng quên mật khẩu -->
            <div id="forgotPasswordFields" style="display:none;">
              <div class="mb-3">
                <label class="form-label" for="otpNewPassword">Mật khẩu mới</label>
                <div class="input-icon">
                  <i class="fas fa-lock"></i>
                  <input type="password" class="form-control" id="otpNewPassword"
                         placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
                  <button class="toggle-pass" type="button" data-target="otpNewPassword" aria-label="Hiện mật khẩu">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback" id="errOtpNewPass"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="otpConfirmPassword">Xác nhận mật khẩu mới</label>
                <div class="input-icon">
                  <i class="fas fa-lock"></i>
                  <input type="password" class="form-control" id="otpConfirmPassword"
                         placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
                  <button class="toggle-pass" type="button" data-target="otpConfirmPassword" aria-label="Hiện mật khẩu">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback" id="errOtpConfirmPass"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100 mb-3" id="otpSubmit">
              <i class="fas fa-circle-check me-2"></i>Xác minh và tiếp tục
            </button>

            <div class="text-center">
              <a th:href="@{/login}" class="btn btn-ghost text-muted small">
                <i class="fas fa-arrow-left me-2"></i>Quay lại đăng nhập
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
