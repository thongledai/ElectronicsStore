<!DOCTYPE html>
<html lang="vi" th:replace="~{layouts/customer-layout :: layout(
        'Tạo mật khẩu — UTE Shop',
        'Tạo mật khẩu cho tài khoản Google của bạn.',
        ~{::main}, ~{}, 'auth.js', false)}">
<head><title>Tạo mật khẩu — UTE Shop</title></head>
<body>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-surface">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width:60px;height:60px;font-size:1.5rem">
              <i class="fas fa-key"></i>
            </div>
            <h1 class="h4 mb-1">Tạo mật khẩu tài khoản</h1>
            <p class="text-muted small">Bạn đã đăng nhập bằng Google. Hãy tạo mật khẩu để có thể đăng nhập bằng email và mật khẩu.</p>
          </div>

          <form id="setPassForm" novalidate>
            <!-- New password -->
            <div class="mb-3">
              <label class="form-label" for="newPassword">Mật khẩu mới</label>
              <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="newPassword"
                       placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" required>
                <button class="toggle-pass" type="button" data-target="newPassword" aria-label="Hiện mật khẩu">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="errNewPassword"></div>
            </div>

            <!-- Confirm new password -->
            <div class="mb-4">
              <label class="form-label" for="confirmNewPassword">Xác nhận mật khẩu mới</label>
              <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="confirmNewPassword"
                       placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
                <button class="toggle-pass" type="button" data-target="confirmNewPassword" aria-label="Hiện mật khẩu">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="errConfirmNewPassword"></div>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100" id="btnSubmitSetPass">
              <i class="fas fa-key me-2"></i>
              <span>Tạo mật khẩu</span>
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
