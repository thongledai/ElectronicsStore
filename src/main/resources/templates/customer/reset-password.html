<!DOCTYPE html>
<html lang="en" th:replace="~{layouts/customer-layout :: layout(
        'Change Password — TechNova Electronics',
        'Update your TechNova customer account password.',
        ~{::main}, ~{}, 'auth.js', false)}">
<head><title>Change Password — TechNova Electronics</title></head>
<body>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-surface">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width:60px;height:60px;font-size:1.5rem">
              <i class="fas fa-lock"></i>
            </div>
            <h1 class="h4 mb-1">Change Password</h1>
            <p class="text-muted small">Regularly update your password to enhance your account security.</p>
          </div>

          <form id="resetPassForm" novalidate>
            <!-- Current password -->
            <div class="mb-3">
              <label class="form-label" for="oldPassword">Current Password</label>
              <div class="input-icon">
                <i class="fas fa-key"></i>
                <input type="password" class="form-control" id="oldPassword"
                       placeholder="Enter current password" autocomplete="current-password" required>
                <button class="toggle-pass" type="button" data-target="oldPassword" aria-label="Show password">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="errOldPassword"></div>
            </div>

            <!-- New password -->
            <div class="mb-3">
              <label class="form-label" for="newPassword">New Password</label>
              <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="newPassword"
                       placeholder="Minimum 6 characters" autocomplete="new-password" required>
                <button class="toggle-pass" type="button" data-target="newPassword" aria-label="Show password">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="errNewPassword"></div>
            </div>

            <!-- Confirm new password -->
            <div class="mb-4">
              <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
              <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="confirmNewPassword"
                       placeholder="Re-enter new password" autocomplete="new-password" required>
                <button class="toggle-pass" type="button" data-target="confirmNewPassword" aria-label="Show password">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="errConfirmNewPassword"></div>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100" id="btnSubmitReset">
              <i class="fas fa-check-circle me-2"></i>Save Changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
