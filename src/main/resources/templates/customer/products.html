<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/customer-layout :: layout(
        'Danh sách sản phẩm — TechNova Electronics',
        'Khám phá các sản phẩm công nghệ chính hãng tại TechNova — Laptop, Điện thoại, Phụ kiện, Tai nghe với nhiều ưu đãi hấp dẫn.',
        ~{::main}, ~{}, 'customer/product-list.js', false)}">
<head><title>Danh sách sản phẩm — TechNova Electronics</title></head>
<body>

<main>

  <!-- PAGE HEAD / BREADCRUMB -->
  <section class="page-head">
    <div class="container">
      <h1 id="pageTitle">Tất cả sản phẩm</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/customer/index}">Trang chủ</a></li>
          <li class="breadcrumb-item active" aria-current="page" id="crumbCurrent">Sản phẩm</li>
        </ol>
      </nav>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="row g-4">

        <!-- ==========================================================
             FILTER SIDEBAR
             ========================================================== -->
        <aside class="col-lg-3">
          <button class="btn btn-ghost w-100 d-lg-none mb-3" type="button"
                  data-bs-toggle="collapse" data-bs-target="#filterPanel" aria-expanded="false">
            <i class="fas fa-layer-group me-2"></i>Danh mục
          </button>

          <div class="collapse d-lg-block" id="filterPanel">
            <div class="filter-panel">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 mb-0"><i class="fas fa-filter me-2 text-primary"></i>Danh mục</h2>
                <a href="#" class="btn btn-sm btn-link p-0 text-decoration-none text-danger js-clear-category">
                  Bỏ chọn
                </a>
              </div>

              <!-- Category list populated by JS -->
              <div class="filter-group">
                <div id="categoryList" class="d-flex flex-column gap-2">
                  <div class="text-center text-muted py-3"><i class="fas fa-spinner fa-spin me-2"></i>Đang tải...</div>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <!-- ==========================================================
             PRODUCT GRID
             ========================================================== -->
        <div class="col-lg-9">
          <!-- Toolbar -->
          <div class="toolbar mb-4">
            <p class="result-count mb-0" id="resultCount">
              Đang tải sản phẩm...
            </p>
          </div>

          <!-- Products grid populated by JS -->
          <div class="row g-3 g-md-4 products-grid" id="productGrid">
            <div class="col-12 text-center py-5">
              <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

</body>
</html>
