<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(
        'My Wishlist — TechNova Electronics',
        'Your saved products at TechNova Electronics',
        ~{::main}, ~{}, 'wishlist.js', false)}">

<head>
  <title>My Wishlist — TechNova Electronics</title>
</head>

<body>

  <main>

    <!-- PAGE HEAD -->
    <section class="page-head">
      <div class="container">
        <h1><i class="fas fa-heart me-2"></i>My Wishlist</h1>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/customer/index}">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
          </ol>
        </nav>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Populated when the wishlist has items -->
        <div id="wishlistLayout" hidden>

          <div class="toolbar">
            <p class="result-count mb-0" id="wishlistCount"></p>
            <div class="d-flex gap-2 flex-wrap">
              <button class="btn btn-brand btn-sm" id="moveAllBtn" type="button">
                <i class="fas fa-cart-plus me-1"></i>Move All to Cart
              </button>
              <button class="btn btn-ghost btn-sm" id="clearWishlistBtn" type="button">
                <i class="fas fa-trash-can me-1"></i>Clear Wishlist
              </button>
            </div>
          </div>

          <!-- Total value strip -->
          <div class="surface-card p-3 mb-4 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="small text-muted">
              <i class="fas fa-tags me-1 text-primary"></i>Total value of saved items
            </span>
            <span>
              <span class="h5 mb-0" id="wishlistValue">₹0</span>
              <span class="price-old ms-2" id="wishlistMrp"></span>
              <span class="badge bg-success ms-2" id="wishlistSavings"></span>
            </span>
          </div>

          <div class="row g-3 g-md-4" id="wishlistGrid"></div>
        </div>

        <!-- Empty state -->
        <div class="empty-state" id="wishlistEmpty" hidden>
          <img th:src="@{/images/empty-wishlist.svg}" alt="">
          <h3>Your wishlist is empty</h3>
          <p>Tap the heart icon on any product to save it here for later. Your list stays in this browser even after you
            close the tab.</p>
          <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a th:href="@{/customer/products}" class="btn btn-brand btn-lg"><i
                class="fas fa-bag-shopping me-2"></i>Explore Products</a>
            <a th:href="@{/customer/cart}" class="btn btn-ghost btn-lg"><i class="fas fa-cart-shopping me-2"></i>View
              Cart</a>
          </div>
        </div>

      </div>
    </section>

    <!-- Recommendations -->
    <section class="section pt-0" id="recommendSection">
      <div class="container">
        <div class="section-head">
          <span class="section-eyebrow"><i class="fas fa-thumbs-up"></i>Recommended</span>
          <h2 class="section-title">Popular right now</h2>
        </div>
        <div class="row g-3 g-md-4" id="recommendGrid"></div>
      </div>
    </section>

  </main>


</body>

</html>
