<!DOCTYPE html>
<html lang="vi" th:replace="~{layouts/dashboard-layout :: layout('Quản lý đơn hàng', 'employee', 'orders', ~{::section.content})}">
<head><title>Quản lý đơn hàng | TechNova</title></head>
<body>
<section class="content order-management">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="title">Quản lý đơn hàng</h1>
      <div class="subtitle">Tra cứu đơn hàng, xác nhận và theo dõi vận đơn GHN.</div>
    </div>
  </div>
  <form class="panel mb-3 d-flex flex-wrap gap-2" method="get" th:action="@{/employee/orders}">
    <label class="visually-hidden" for="orderKeyword">Tìm đơn hàng</label>
    <input id="orderKeyword" class="form-control flex-grow-1" name="keyword" th:value="${keyword}"
           placeholder="Tên khách, số điện thoại hoặc mã GHN">
    <label class="visually-hidden" for="orderStatusFilter">Lọc trạng thái</label>
    <select id="orderStatusFilter" class="form-select" name="status" style="max-width:240px">
      <option value="">Tất cả trạng thái</option>
      <option value="NOT_PROCESSED" th:selected="${statusFilter == 'NOT_PROCESSED'}">Chưa xử lý</option>
      <option value="CONFIRMED" th:selected="${statusFilter == 'CONFIRMED'}">Đã xác nhận</option>
      <option value="SHIPPING" th:selected="${statusFilter == 'SHIPPING'}">Đang vận chuyển</option>
      <option value="DELIVERED" th:selected="${statusFilter == 'DELIVERED'}">Đã giao</option>
      <option value="CANCELLED" th:selected="${statusFilter == 'CANCELLED'}">Đã hủy</option>
      <option value="RETURNED" th:selected="${statusFilter == 'RETURNED'}">Đã hoàn</option>
    </select>
    <button class="btn btn-primary" type="submit">Tìm kiếm</button>
  </form>
  <div class="panel table-responsive">
    <table class="table align-middle mb-0">
      <thead>
      <tr>
        <th scope="col">Mã đơn</th><th scope="col">Khách hàng</th><th scope="col">Địa chỉ giao</th>
        <th scope="col">Ngày đặt</th><th scope="col">Tổng tiền</th><th scope="col">Thanh toán</th>
        <th scope="col">Xử lý</th><th scope="col">Mã vận đơn</th><th scope="col">Trạng thái GHN</th><th scope="col"></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders.content}">
        <td class="text-break" th:text="${order.id}">order-id</td>
        <td><span th:text="${order.user.fullName}">Khách hàng</span><small class="d-block text-muted" th:text="${order.phone}"></small></td>
        <td class="text-break" th:text="${order.address}">Địa chỉ</td>
        <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
        <td class="text-nowrap" th:text="|${#numbers.formatDecimal(order.amountFromUser, 0, 'COMMA', 0, 'POINT')} ₫|">0 ₫</td>
        <td th:text="${order.payment.name}">Phương thức</td>
        <td><span class="badge text-bg-secondary" th:text="${order.status.name}">CONFIRMED</span></td>
        <td class="text-break" th:text="${order.ghnOrderCode != null ? order.ghnOrderCode : '—'}">—</td>
        <td th:text="${order.ghnStatus != null ? order.ghnStatus : 'Chưa tạo vận đơn'}">GHN</td>
        <td><a class="btn btn-sm btn-outline-primary" th:href="@{/employee/orders/{id}(id=${order.id})}">Chi tiết</a></td>
      </tr>
      <tr th:if="${orders.empty}"><td colspan="10" class="text-center text-muted py-4">Không có đơn hàng phù hợp.</td></tr>
      </tbody>
    </table>
    <nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Phân trang đơn hàng" th:if="${orders.totalPages > 1}">
      <a class="btn btn-sm btn-outline-secondary" th:if="${orders.hasPrevious()}" th:href="@{/employee/orders(page=${orders.number - 1},keyword=${keyword},status=${statusFilter})}">Trang trước</a>
      <span th:text="|Trang ${orders.number + 1}/${orders.totalPages}|">Trang</span>
      <a class="btn btn-sm btn-outline-secondary" th:if="${orders.hasNext()}" th:href="@{/employee/orders(page=${orders.number + 1},keyword=${keyword},status=${statusFilter})}">Trang sau</a>
    </nav>
  </div>
</section>
</body>
</html>
