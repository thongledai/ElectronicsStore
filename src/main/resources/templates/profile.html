<!DOCTYPE html>
<html lang="vi" th:replace="~{layouts/customer-layout :: layout(
        'Hồ sơ cá nhân — UTE Shop',
        'Quản lý và cập nhật thông tin cá nhân tài khoản của bạn.',
        ~{::main}, ~{}, 'common/profile.js', false)}">
<head><title>Hồ sơ cá nhân</title></head>
<body>

<main class="profile-page py-4 py-md-5">
  <div class="container">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a th:href="@{/customer/index}" class="text-decoration-none">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Hồ sơ cá nhân</li>
      </ol>
    </nav>

    <div class="row g-4 justify-content-center profile-layout">
      <!-- Cột trái: Tóm tắt thông tin & Avatar -->
      <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 text-center p-4 h-100 bg-surface profile-summary">
          <!-- Avatar container with camera button -->
          <div class="position-relative d-inline-block mx-auto mb-3" style="width: 110px; height: 110px;">
            <img id="avatarPreview" src="https://ui-avatars.com/api/?name=User&background=0d6efd&color=fff"
                 class="rounded-circle border border-3 border-white shadow object-fit-cover w-100 h-100"
                 alt="Avatar" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=User&background=0d6efd&color=fff';">
            <label for="profileAvatarFile"
                   class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle p-0 d-flex align-items-center justify-content-center shadow"
                   style="width: 34px; height: 34px; cursor: pointer;" title="Đổi ảnh đại diện">
              <i class="fa-solid fa-camera fa-sm text-white"></i>
            </label>
            <input type="file" id="profileAvatarFile" class="d-none" accept="image/png, image/jpeg, image/webp">
          </div>
          <div class="invalid-feedback d-block text-danger mb-2" id="avatarError" style="display:none;"></div>

          <h5 class="fw-bold mb-1" id="summaryFullName">---</h5>
          <p class="text-muted small mb-2 profile-summary-email" id="summaryEmail">---</p>
          <div class="mb-3">
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-1 rounded-pill" id="summaryRole">
              Khách hàng
            </span>
          </div>

          <hr class="my-3 opacity-10">
        </div>
      </div>

      <!-- Cột phải: Form cập nhật thông tin -->
      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-surface h-100">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4 pb-2 border-bottom">
            <div>
              <h4 class="fw-bold mb-1">Thông tin cá nhân</h4>
            </div>
            <span class="badge bg-light text-secondary border px-3 py-2 text-break" id="summaryUserCode">
              Mã: ---
            </span>
          </div>

          <form id="profileForm" class="profile-form" novalidate>
            <div class="row g-3">
            <!-- Họ và tên -->
            <div class="col-12">
              <label class="form-label fw-semibold" for="profileFullName">
                Họ và tên <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fas fa-user"></i></span>
                <input type="text" class="form-control" id="profileFullName" placeholder="Nhập họ và tên đầy đủ" required>
              </div>
              <div class="invalid-feedback" id="errFullName"></div>
            </div>

            <!-- Email (Read-only) -->
            <div class="col-12">
              <label class="form-label fw-semibold" for="profileEmail">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fas fa-envelope"></i></span>
                <input type="email" class="form-control bg-light" id="profileEmail" disabled readonly>
              </div>
            </div>

            <!-- Số điện thoại -->
            <div class="col-12">
              <label class="form-label fw-semibold" for="profilePhone">Số điện thoại</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fas fa-phone"></i></span>
                <input type="tel" class="form-control" id="profilePhone" placeholder="Nhập số điện thoại" pattern="^(\+84|0)\d{9,10}$">
              </div>
              <div class="invalid-feedback" id="errPhone"></div>
            </div>

            <!-- Địa chỉ giao hàng -->
            <div class="col-12">
              <label class="form-label fw-semibold" for="profileAddresses">Địa chỉ</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fas fa-location-dot"></i></span>
                <textarea class="form-control" id="profileAddresses" rows="1" placeholder="Nhập số nhà, tên đường, phường/xã, tỉnh/thành phố"></textarea>
              </div>
              <div class="invalid-feedback" id="errAddresses"></div>
            </div>

            <!-- Nút Lưu -->
            <div class="col-12 d-flex justify-content-end gap-2 pt-2">
              <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold" id="btnSaveProfile">
                <i class="fas fa-floppy-disk me-2"></i>Lưu
              </button>
            </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
